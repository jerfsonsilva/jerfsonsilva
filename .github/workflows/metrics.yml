name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Token esperado: classic PAT com repo + read:user.
# commits_authoring ajuda o plugin a mapear autoria em contas com vários emails/aliases.

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate overview metrics (inclui repositórios privados com PAT)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: jerfsonsilva
          filename: assets/metrics-stats.svg
          base: header, activity, community, repositories, metadata
          repositories_affiliations: owner, collaborator, organization_member
          repositories_forks: yes
          repositories_batch: 100
          committer_token: ${{ github.token }}
          committer_branch: ${{ github.ref_name }}
          plugins_errors_fatal: false

  languages:
    needs: stats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Generate languages metrics (indepth)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: jerfsonsilva
          filename: assets/metrics-languages.svg
          base: ""
          repositories_affiliations: owner, collaborator, organization_member
          repositories_forks: yes
          repositories_batch: 100
          commits_authoring: jerfsonsilva, Jerfson Silva dos Santos, jerfsonlink@gmail.com, jerfsonsilva@users.noreply.github.com
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 30
          plugin_languages_analysis_timeout_repositories: 15
          plugin_languages_limit: 8
          # recently-used pode quebrar com eventos sem `committer` em algumas contas
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage, lines
          plugin_languages_other: yes
          plugin_languages_threshold: 0%
          committer_token: ${{ github.token }}
          committer_branch: ${{ github.ref_name }}
          plugins_errors_fatal: false

  repos_activity:
    needs: languages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Atividade em repositórios (linhas + histórico, públicos e privados)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: jerfsonsilva
          filename: assets/metrics-repos-activity.svg
          base: ""
          repositories_affiliations: owner, collaborator, organization_member
          repositories_forks: yes
          repositories_batch: 100
          commits_authoring: jerfsonsilva, Jerfson Silva dos Santos, jerfsonlink@gmail.com, jerfsonsilva@users.noreply.github.com
          plugin_lines: yes
          plugin_lines_delay: 30
          plugin_lines_sections: repositories, history
          plugin_lines_repositories_limit: 8
          plugin_lines_history_limit: 2
          committer_token: ${{ github.token }}
          committer_branch: ${{ github.ref_name }}
          plugins_errors_fatal: false

  featured_repos:
    needs: repos_activity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Repositórios destacados (substitui troféus externos)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: jerfsonsilva
          filename: assets/metrics-featured-repos.svg
          base: ""
          repositories_affiliations: owner, collaborator, organization_member
          repositories_forks: yes
          plugin_repositories: yes
          plugin_repositories_pinned: 6
          plugin_repositories_starred: 4
          plugin_repositories_random: 2
          plugin_repositories_order: pinned, starred, random
          committer_token: ${{ github.token }}
          committer_branch: ${{ github.ref_name }}
          plugins_errors_fatal: false
