name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate overview metrics (inclui repositórios privados com PAT)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: jerfsonsilva
          filename: assets/metrics-stats.svg
          base: header, activity, community, repositories, metadata
          committer_token: ${{ github.token }}
          committer_branch: ${{ github.ref_name }}
          plugins_errors_fatal: false

      - name: Checkout atualizado após o primeiro commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Generate languages metrics (inclui repositórios privados com PAT)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: jerfsonsilva
          filename: assets/metrics-languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 10
          plugin_languages_sections: most-used
          committer_token: ${{ github.token }}
          committer_branch: ${{ github.ref_name }}
          plugins_errors_fatal: false
