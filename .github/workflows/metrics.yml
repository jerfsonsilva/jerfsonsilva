name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Variáveis comuns: PAT com escopo `repo` (repos privados) + `read:user`.
# Fine-grained: leitura de conteúdo/metadata nos repositórios que o token cobre.

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate overview metrics (inclui repositórios privados com PAT)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: jerfsonsilva
          filename: assets/metrics-stats.svg
          base: header, activity, community, repositories, metadata
          repositories_affiliations: owner, collaborator, organization_member
          repositories_forks: yes
          repositories_batch: 100
          committer_token: ${{ github.token }}
          committer_branch: ${{ github.ref_name }}
          plugins_errors_fatal: false

  languages:
    needs: stats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Generate languages metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: jerfsonsilva
          filename: assets/metrics-languages.svg
          base: ""
          repositories_affiliations: owner, collaborator, organization_member
          repositories_forks: yes
          repositories_batch: 100
          plugin_languages: yes
          # O plugin aceita no máximo 8 idiomas; valores maiores quebram o card (0 languages).
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_other: yes
          plugin_languages_threshold: 0%
          committer_token: ${{ github.token }}
          committer_branch: ${{ github.ref_name }}
          plugins_errors_fatal: false

  repos_activity:
    needs: languages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Atividade em repositórios (linhas + histórico, públicos e privados)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: jerfsonsilva
          filename: assets/metrics-repos-activity.svg
          base: ""
          repositories_affiliations: owner, collaborator, organization_member
          repositories_forks: yes
          repositories_batch: 100
          plugin_lines: yes
          plugin_lines_delay: 30
          plugin_lines_sections: repositories, history
          plugin_lines_repositories_limit: 8
          plugin_lines_history_limit: 1
          committer_token: ${{ github.token }}
          committer_branch: ${{ github.ref_name }}
          plugins_errors_fatal: false
